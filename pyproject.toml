[project]
name = "combine-mzml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ipython>=9.13.0",
    "pyopenms>=3.5.0",
    "pyqt5>=5.15.11",
    "typer>=0.25.1",
]

[project.scripts]
combine-mzml = "combine_mzml.cli:app"

[project.gui-scripts]
combine-mzml-gui = "combine_mzml.gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["combine_mzml"]

[tool.uv]
# Force the resolver to pick package versions whose wheels exist for *all*
# of these environments, not just the one we happen to be syncing on. This
# is necessary because `pyqt5-qt5` ships different latest versions per OS:
# 5.15.18 has only Linux/macOS wheels, while Windows tops out at older
# releases. Without this constraint, syncing on Linux locks a version
# that then fails to install on the Windows VM.
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]



